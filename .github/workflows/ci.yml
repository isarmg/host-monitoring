name: Host Monitoring CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  rust-contracts:
    name: Worker and protocol (Rust 1.98)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Assert the authoritative in-repository protocol boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'host-protocol = { path = "protocol" }' Cargo.toml
          grep -Fx 'host-protocol.workspace = true' host-m-agent/Cargo.toml
          grep -Fx 'host-protocol.workspace = true' host-monitoring-server/Cargo.toml
          if grep -RE 'host-protocol[[:space:]]*=.*(git|rev|branch|tag)[[:space:]]*=' \
              -- Cargo.toml host-m-agent/Cargo.toml host-monitoring-server/Cargo.toml; then
            echo 'Host components must use the authoritative workspace protocol path.' >&2
            exit 1
          fi
          cargo pkgid --locked -p host-m-agent | grep -F '#0.7.0'
          cargo pkgid --locked -p host-monitoring-server \
            | grep -F '#host-monitoring-server@0.7.0'
          cargo pkgid --locked -p host-protocol | grep -F '#host-protocol@0.7.0'
      - name: Check worker and protocol
        run: cargo check --locked -p host-monitoring-server -p host-protocol --all-targets
      - name: Test worker, protocol, and Manifest contracts
        run: cargo test --locked -p host-monitoring-server -p host-protocol
      - name: Clippy
        run: cargo clippy --locked -p host-monitoring-server -p host-protocol --all-targets -- -D warnings

  host-m-agent:
    name: Desktop host-m-agent (${{ matrix.os }})
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - name: Resolve Windows MSI version from Cargo metadata
        if: runner.os == 'Windows'
        id: host_m_agent_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
          $agentPackage = @($metadata.packages | Where-Object name -eq "host-m-agent")
          if ($agentPackage.Count -ne 1) {
              throw "cargo metadata did not contain exactly one host-m-agent package."
          }
          $version = $agentPackage[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Windows MSI requires a strict MAJOR.MINOR.PATCH Cargo version; found '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Clippy
        run: cargo clippy --locked -p host-m-agent --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p host-m-agent
      - name: Check without optional features
        run: cargo check --locked -p host-m-agent --no-default-features --all-targets
      - name: Check OTLP only
        run: cargo check --locked -p host-m-agent --no-default-features --features otlp --all-targets
      - name: Check NVIDIA only
        run: cargo check --locked -p host-m-agent --no-default-features --features nvidia --all-targets
      - name: Validate Linux packaging lifecycle
        if: runner.os == 'Linux'
        run: sh host-m-agent/packaging/linux/tests/test-lifecycle.sh
      - name: Validate Linux package builder
        if: runner.os == 'Linux'
        run: sh host-m-agent/packaging/linux/tests/test-build-packages.sh
      - name: Build native Windows service, tray companion, and maintenance helper
        if: runner.os == 'Windows'
        run: >-
          cargo build --locked --release -p host-m-agent --target x86_64-pc-windows-msvc
          --bin host-m-agent --bin host-m-agent-maintenance --bin host-m-agent-tray
      - name: Verify native Windows PE subsystems
        if: runner.os == 'Windows'
        shell: powershell
        run: host-m-agent\packaging\windows\tests\Test-PeSubsystems.ps1
      - name: Validate WiX MSI authoring
        if: runner.os == 'Windows'
        shell: powershell
        run: host-m-agent\packaging\windows\tests\Test-WixAuthoring.ps1
      - name: Build WiX 4 MSI
        if: runner.os == 'Windows'
        shell: cmd
        env:
          HOST_M_AGENT_VERSION: ${{ steps.host_m_agent_version.outputs.version }}
        run: >-
          host-m-agent\packaging\windows\wix\build-msi.cmd %HOST_M_AGENT_VERSION%
          target\x86_64-pc-windows-msvc\release\host-m-agent.exe
          target\x86_64-pc-windows-msvc\release\host-m-agent-maintenance.exe
          target\x86_64-pc-windows-msvc\release\host-m-agent-tray.exe
      - name: Validate macOS packaging lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: sh host-m-agent/packaging/macos/tests/validate-packaging.sh

  android-host-m-agent-library:
    name: Mobile host-m-agent library (Android / ${{ matrix.target }})
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain and Android target
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 ${{ matrix.target }}
      - name: Check host-driven library boundary
        run: >-
          cargo check --locked -p host-m-agent --target ${{ matrix.target }}
          --lib --no-default-features

  apple-mobile-host-m-agent-library:
    name: Mobile host-m-agent library (${{ matrix.scope }} / ${{ matrix.target }})
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: iOS/iPadOS device
            target: aarch64-apple-ios
          - scope: iOS/iPadOS simulator
            target: aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain and Apple target
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 ${{ matrix.target }}
      - name: Check host-driven library boundary
        run: >-
          cargo check --locked -p host-m-agent --target ${{ matrix.target }}
          --lib --no-default-features

  otlp:
    name: host-m-agent OTLP end-to-end
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      collector:
        image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
        ports:
          - 4318:4318
    env:
      HOST_M_AGENT_TEST_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/metrics
      HOST_M_AGENT_TEST_REQUIRE_OTLP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Wait for Collector
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' \
                 -X POST http://127.0.0.1:4318/v1/metrics \
                 -H 'content-type: application/x-protobuf' --data-binary '' | grep -qE '^(200|400|415)$'; then
              echo "collector is accepting connections"; exit 0
            fi
            sleep 2
          done
          echo "collector did not become ready" >&2; exit 1
      - name: Validate OTLP protobuf encoding
        run: >-
          cargo test --locked -p host-m-agent --no-default-features --features otlp
          --test otlp_encoding
      - name: OTLP end-to-end
        run: >-
          cargo test --locked -p host-m-agent --no-default-features --features otlp
          --test otlp_live

  frontend-contract:
    name: Dynamic frontend contract
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: host-monitoring-server/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: host-monitoring-server/web
        run: npm ci
      - name: Build standalone frontend
        working-directory: host-monitoring-server/web
        run: npm run build
