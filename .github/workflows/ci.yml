name: Host Monitoring CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-contracts:
    name: Worker and protocol (Rust 1.98)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Assert the authoritative in-repository protocol boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'unionc-protocol = { path = "protocol" }' Cargo.toml
          grep -Fx 'unionc-protocol.workspace = true' agent/Cargo.toml
          grep -Fx 'unionc-protocol.workspace = true' host-monitoring-worker/Cargo.toml
          if grep -RE 'unionc-protocol[[:space:]]*=.*(git|rev|branch|tag)[[:space:]]*=' \
              -- Cargo.toml agent/Cargo.toml host-monitoring-worker/Cargo.toml; then
            echo 'Host components must use the authoritative workspace protocol path.' >&2
            exit 1
          fi
          cargo pkgid --locked -p unionc-agent | grep -F '#unionc-agent@0.5.0'
          cargo pkgid --locked -p union-host-monitoring-worker \
            | grep -F '#union-host-monitoring-worker@0.5.0'
          cargo pkgid --locked -p unionc-protocol | grep -F '#unionc-protocol@0.5.0'
      - name: Check worker and protocol
        run: cargo check --locked -p union-host-monitoring-worker -p unionc-protocol --all-targets
      - name: Test worker, protocol, and Manifest contracts
        run: cargo test --locked -p union-host-monitoring-worker -p unionc-protocol
      - name: Clippy
        run: cargo clippy --locked -p union-host-monitoring-worker -p unionc-protocol --all-targets -- -D warnings

  agent:
    name: Desktop Agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Resolve Windows MSI version from Cargo metadata
        if: runner.os == 'Windows'
        id: agent_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
          $agentPackage = @($metadata.packages | Where-Object name -eq "unionc-agent")
          if ($agentPackage.Count -ne 1) {
              throw "cargo metadata did not contain exactly one unionc-agent package."
          }
          $version = $agentPackage[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Windows MSI requires a strict MAJOR.MINOR.PATCH Cargo version; found '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Clippy
        run: cargo clippy --locked -p unionc-agent --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p unionc-agent
      - name: Check without optional features
        run: cargo check --locked -p unionc-agent --no-default-features --all-targets
      - name: Check OTLP only
        run: cargo check --locked -p unionc-agent --no-default-features --features otlp --all-targets
      - name: Check NVIDIA only
        run: cargo check --locked -p unionc-agent --no-default-features --features nvidia --all-targets
      - name: Validate Linux packaging lifecycle
        if: runner.os == 'Linux'
        run: sh agent/packaging/linux/tests/test-lifecycle.sh
      - name: Validate Linux package builder
        if: runner.os == 'Linux'
        run: sh agent/packaging/linux/tests/test-build-packages.sh
      - name: Build native Windows service, tray companion, and maintenance helper
        if: runner.os == 'Windows'
        run: >-
          cargo build --locked --release -p unionc-agent --target x86_64-pc-windows-msvc
          --bin unionc-agent --bin unionc-agent-maintenance --bin unionc-agent-tray
      - name: Verify native Windows PE subsystems
        if: runner.os == 'Windows'
        shell: powershell
        run: agent\packaging\windows\tests\Test-PeSubsystems.ps1
      - name: Validate WiX MSI authoring
        if: runner.os == 'Windows'
        shell: powershell
        run: agent\packaging\windows\tests\Test-WixAuthoring.ps1
      - name: Build WiX 4 MSI
        if: runner.os == 'Windows'
        shell: cmd
        env:
          AGENT_VERSION: ${{ steps.agent_version.outputs.version }}
        run: >-
          agent\packaging\windows\wix\build-msi.cmd %AGENT_VERSION%
          target\x86_64-pc-windows-msvc\release\unionc-agent.exe
          target\x86_64-pc-windows-msvc\release\unionc-agent-maintenance.exe
          target\x86_64-pc-windows-msvc\release\unionc-agent-tray.exe
      - name: Validate macOS packaging lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: sh agent/packaging/macos/tests/validate-packaging.sh

  android-agent-library:
    name: Mobile Agent library (Android / ${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check host-driven library boundary
        run: >-
          cargo check --locked -p unionc-agent --target ${{ matrix.target }}
          --lib --no-default-features

  apple-mobile-agent-library:
    name: Mobile Agent library (${{ matrix.scope }} / ${{ matrix.target }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: iOS/iPadOS device
            target: aarch64-apple-ios
          - scope: iOS/iPadOS simulator
            target: aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check host-driven library boundary
        run: >-
          cargo check --locked -p unionc-agent --target ${{ matrix.target }}
          --lib --no-default-features

  otlp:
    name: Agent OTLP end-to-end
    runs-on: ubuntu-24.04
    services:
      collector:
        image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
        ports:
          - 4318:4318
    env:
      UNIONC_AGENT_TEST_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/metrics
      UNIONC_AGENT_TEST_REQUIRE_OTLP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Wait for Collector
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' \
                 -X POST http://127.0.0.1:4318/v1/metrics \
                 -H 'content-type: application/x-protobuf' --data-binary '' | grep -qE '^(200|400|415)$'; then
              echo "collector is accepting connections"; exit 0
            fi
            sleep 2
          done
          echo "collector did not become ready" >&2; exit 1
      - name: Validate OTLP protobuf encoding
        run: >-
          cargo test --locked -p unionc-agent --no-default-features --features otlp
          --test otlp_encoding
      - name: OTLP end-to-end
        run: >-
          cargo test --locked -p unionc-agent --no-default-features --features otlp
          --test otlp_live

  frontend-contract:
    name: Dynamic frontend contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.7.0'
      - run: node --test host-monitoring-worker/frontend/entry.test.mjs
