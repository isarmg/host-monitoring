name: Independence gate
on: [push, pull_request]

permissions:
  contents: read

jobs:
  independence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject cross-project coupling and container deployment
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --exclude-dir=.git --exclude-dir=target --exclude-dir=node_modules --exclude-dir=.github 'UNION_|X-Union-|[Uu]nion[Cc]|PluginManifest|ProcessContext|sarmg-platform|sarmg_platform' .; then exit 1; fi
          if find . -maxdepth 4 \( -iname 'Dockerfile*' -o -iname 'docker-compose*.yml' -o -iname 'docker-compose*.yaml' \) | grep .; then exit 1; fi
