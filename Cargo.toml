[workspace]
resolver = "3"
members = [
  "agent",
  "host-monitoring-worker",
  "protocol",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/host-monitoring"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unionc-protocol = { path = "protocol" }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
